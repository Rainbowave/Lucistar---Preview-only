
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>LuciSin - The Ultimate Creator Network</title>
    
    <!-- PWA / Native App Config -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LuciSin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fc8347" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Join LuciSin to stream, share content, sell products, and connect with fans. The premier platform for creators, artists, and influencers." />
    <meta name="keywords" content="social media, creator economy, live streaming, web3, content monetization, art, comics, video, shorts" />
    <meta name="author" content="LuciSin" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LuciSin - Where Creativity Meets The Pride" />
    <meta property="og:description" content="Discover, stream, and earn. Join the top-tier ranks of LuciStars." />
    <meta property="og:image" content="https://lucisin.com/og-image.jpg" />
    <meta property="og:url" content="https://lucisin.com" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LuciSin" />
    <meta name="twitter:description" content="The ultimate social platform for creators." />
    <meta name="twitter:image" content="https://lucisin.com/twitter-image.jpg" />

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        /* LIGHT MODE PALETTE REDESIGN */
        --bg-main: #191919;
        --text-primary: #e8eaed;
        
        /* Mapping 'dark' palette to Light Mode equivalents */
        --bg-dark-950: #191919; /* Sidebar / Header - Primary BG */
        --bg-dark-900: #191919; /* Main Background */
        --bg-dark-850: #191919; /* Content Area */
        --bg-dark-800: #252525; /* Cards - User Profile Card BG */
        --bg-dark-700: #3c4043; /* Borders - Light Gray */
        --bg-dark-600: #9aa0a6; /* Secondary Text - Gray */
        
        /* Brand Colors */
        --brand-main: #fc8347;
        --brand-second: #e8eaed;
      }

      .dark {
        /* DARK MODE */
        --bg-main: #191919;
        --text-primary: #e8eaed;
        
        /* Google Dark Palette */
        --bg-dark-950: #191919;
        --bg-dark-900: #191919;
        --bg-dark-850: #191919;
        --bg-dark-800: #1f1f1f;
        --bg-dark-700: #3c4043;
        --bg-dark-600: #9aa0a6;
      }

      body {
        background-color: var(--bg-dark-900);
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Inter', sans-serif;
        letter-spacing: -0.02em;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .sidebar-item {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .sidebar-item:hover {
        background-color: rgba(10, 211, 150, 0.1);
        color: var(--brand-second);
      }

      .sidebar-item.active {
        background-color: var(--brand-main) !important;
        color: #fff !important;
        font-weight: 800;
      }

      * {
        box-shadow: none !important;
        text-shadow: none !important;
      }

      /* LIGHT MODE OVERRIDES */
      :root:not(.dark) .text-white { color: #1a1a1a; }
      :root:not(.dark) .text-gray-400, :root:not(.dark) .text-gray-500 { color: #6b7280; }
      :root:not(.dark) .text-gray-300 { color: #4b5563; }
      :root:not(.dark) .border-white\/5, :root:not(.dark) .border-white\/10, :root:not(.dark) .border-white\/20 { border-color: #e5e7eb; }
      :root:not(.dark) .bg-dark-800 { background-color: #ffffff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important; }
      :root:not(.dark) .bg-dark-900 { background-color: #f3f4f6; }
      
      /* EXCEPTIONS */
      :root:not(.dark) .bg-brand-500 .text-white,
      :root:not(.dark) .bg-brand-600 .text-white,
      :root:not(.dark) .bg-black .text-white,
      :root:not(.dark) .bg-dark-950 .text-white,
      :root:not(.dark) button[class*="bg-brand"] .text-white,
      :root:not(.dark) button[class*="bg-red"] .text-white,
      :root:not(.dark) button[class*="bg-green"] .text-white,
      :root:not(.dark) button[class*="bg-blue"] .text-white,
      :root:not(.dark) .group:hover .text-white,
      :root:not(.dark) .sidebar-item.active .text-white,
      :root:not(.dark) .text-white-force {
          color: #ffffff !important;
      }
    </style>
    
    <script>
      // POLYFILL: Ensure process.env exists to prevent black screen crashes
      window.process = window.process || { env: { API_KEY: '' } };

      // Global theme initialization from localStorage
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        if (!savedTheme) localStorage.setItem('theme', 'dark');
      }

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { 
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c',
                500: '#fc8347', // Main Color Updated
                600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12',
                second: '#e8eaed', // Second Color Updated
              },
              dark: {
                950: 'var(--bg-dark-950)',
                900: 'var(--bg-dark-900)',
                850: 'var(--bg-dark-850)',
                800: 'var(--bg-dark-800)',
                700: 'var(--bg-dark-700)',
                600: 'var(--bg-dark-600)',
              },
              light: {
                900: '#F5E9CE', 
                800: '#EBD9B2', 
                700: '#E1CAA1',
                base: '#e3dfd3',
              },
              gray: { 100: '#f4f4f5', 300: '#d4d4d8', 400: '#a1a1aa' }
            },
            borderRadius: {
              'none': '0',
              'sm': '2px',
              'DEFAULT': '4px',
              'md': '5px',
              'lg': '5px',
              'xl': '5px',
              '2xl': '5px',
              '3xl': '5px',
              'full': '9999px',
            },
            animation: { 'spin-slow': 'spin 3s linear infinite' }
          }
        }
      }
    </script>
</head>
  <body class="font-sans antialiased transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
